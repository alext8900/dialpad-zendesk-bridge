services:
  bridge:
    build: .
    restart: unless-stopped
    # No host port published on purpose: the public path is the Cloudflare Tunnel
    # (cloudflared reaches the bridge at bridge:8080 over the internal network),
    # so nothing needs to bind a host port. This also sidesteps Windows reserving
    # ports like 8080 (WinNAT/Hyper-V). To expose it locally anyway, add e.g.
    #   ports: ["18080:8080"]   # pick a port not in `netsh int ipv4 show excludedportrange protocol=tcp`
    expose:
      - "8080"              # reachable to cloudflared on the internal network
    env_file: .env
    volumes:
      - ./data:/data        # SQLite state survives restarts
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cloudflare Tunnel -> publishes the bridge at dialpad.bpiteam.com with a
  # stable URL and no inbound firewall ports. Create the tunnel in the Cloudflare
  # Zero Trust dashboard, point its public hostname at http://bridge:8080, and
  # put its token in .env as TUNNEL_TOKEN. See README "Public URL".
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Force HTTP/2 over TCP instead of the default QUIC. In Docker (esp. on
    # Windows/WSL2) the UDP receive buffer is too small for QUIC, which drops
    # packets and causes intermittent 502s. HTTP/2 is reliable here.
    command: tunnel --no-autoupdate run --protocol http2 --token ${TUNNEL_TOKEN}
    # Wait until the bridge is HEALTHY before starting, so its service-name DNS
    # entry exists on the network first (avoids "lookup bridge: no such host"
    # when cloudflared starts/recreates ahead of the bridge).
    depends_on:
      bridge:
        condition: service_healthy
